name: Sync Upstream & Release

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync-and-build:
    name: Sync upstream, build, and release
    runs-on: macos-latest

    steps:
      - name: Checkout fork branch
        uses: actions/checkout@v4
        with:
          ref: fix/macos-tray-icon-crash
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/deskflow/deskflow.git
          git fetch upstream master

      - name: Merge upstream changes
        id: merge
        run: |
          if git merge upstream/master --no-edit -m "auto: merge upstream/master"; then
            echo "merged=true" >> $GITHUB_OUTPUT
          else
            echo "merged=false" >> $GITHUB_OUTPUT
            echo "::warning::Merge conflict with upstream/master. Manual resolution needed."
            git merge --abort
          fi

      - name: Push merge result
        if: steps.merge.outputs.merged == 'true'
        run: |
          git push origin fix/macos-tray-icon-crash

      - name: Install build dependencies
        if: steps.merge.outputs.merged == 'true'
        run: |
          brew install cmake ninja qt@6

      - name: Configure CMake
        if: steps.merge.outputs.merged == 'true'
        run: |
          mkdir build
          cd build
          cmake .. -G Ninja -DCMAKE_PREFIX_PATH="$(brew --prefix qt@6)" -DCMAKE_BUILD_TYPE=Release

      - name: Build Deskflow
        if: steps.merge.outputs.merged == 'true'
        run: |
          cd build
          ninja Deskflow deskflow-core

      - name: Create DMG
        if: steps.merge.outputs.merged == 'true'
        run: |
          hdiutil create -volname Deskflow -srcfolder build/bin/Deskflow.app -ov -format UDZO /tmp/Deskflow-macos-arm64.dmg

      - name: Generate release tag
        if: steps.merge.outputs.merged == 'true'
        id: tag
        run: |
          TAG="v$(date +%Y%m%d-%H%M%S)"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: steps.merge.outputs.merged == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Deskflow macOS – ${{ steps.tag.outputs.tag }}"
          body: |
            Automated build with macOS tray icon crash fix (native NSStatusItem + NSPopover).

            Synced with upstream/master. Built from `fix/macos-tray-icon-crash`.
          files: /tmp/Deskflow-macos-arm64.dmg
          draft: false
          prerelease: true
