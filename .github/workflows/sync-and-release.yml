name: Sync Upstream & Release

on:
  schedule:
    # Run daily at 08:00 UTC
    - cron: '0 8 * * *'
  workflow_dispatch:
    # Allow manual trigger from GitHub UI

permissions:
  contents: write
  actions: write

jobs:
  sync-and-build:
    name: Sync upstream, build, and release
    runs-on: macos-latest

    steps:
      - name: Checkout fork branch
        uses: actions/checkout@v4
        with:
          ref: fix/macos-tray-icon-crash
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/deskflow/deskflow.git
          git fetch upstream master

      - name: Merge upstream changes
        id: merge
        run: |
          if git merge upstream/master --no-edit -m "auto: merge upstream/master"; then
            echo "merged=true" >> $GITHUB_OUTPUT
          else
            echo "merged=false" >> $GITHUB_OUTPUT
            echo "::warning::Merge conflict with upstream/master. Manual resolution needed."
            git merge --abort
          fi

      - name: Push merge result
        if: steps.merge.outputs.merged == 'true'
        run: |
          git push origin fix/macos-tray-icon-crash

      - name: Install build dependencies
        if: steps.merge.outputs.merged == 'true'
        run: |
          brew install cmake ninja qt@6

      - name: Configure CMake
        if: steps.merge.outputs.merged == 'true'
        run: |
          mkdir build
          cd build
          cmake .. \
            -G Ninja \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt@6)" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build Deskflow
        if: steps.merge.outputs.merged == 'true'
        run: |
          cd build
          ninja Deskflow deskflow-core

      - name: Copy translations & resources
        if: steps.merge.outputs.merged == 'true'
        run: |
          # Fetch latest release to get translations
          LATEST_URL=$(curl -s https://api.github.com/repos/deskflow/deskflow/releases/latest | jq -r '.assets[] | select(.name | endswith(".dmg")) | .browser_download_url' | head -1)
          if [ -n "$LATEST_URL" ]; then
            curl -L -o /tmp/deskflow-latest.dmg "$LATEST_URL"
            hdiutil attach /tmp/deskflow-latest.dmg -mountpoint /tmp/deskflow-mount -nobrowse
            cp -R /tmp/deskflow-mount/Deskflow.app/Contents/Resources/translations build/bin/Deskflow.app/Contents/Resources/ 2>/dev/null || true
            hdiutil detach /tmp/deskflow-mount
          fi
          # Create basic qt.conf so Qt finds plugins via Homebrew
          mkdir -p build/bin/Deskflow.app/Contents/Resources
          echo "[Paths]" > build/bin/Deskflow.app/Contents/Resources/qt.conf
          echo "Plugins = $(brew --prefix qt@6)/share/qt/plugins" >> build/bin/Deskflow.app/Contents/Resources/qt.conf

      - name: Create DMG
        if: steps.merge.outputs.merged == 'true'
        run: |
          hdiutil create -volname Deskflow -srcfolder build/bin/Deskflow.app -ov -format UDZO /tmp/Deskflow-macos-arm64.dmg

      - name: Generate release tag
        if: steps.merge.outputs.merged == 'true'
        id: tag
        run: |
          TAG="release-$(date +%Y%m%d-%H%M%S)"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: steps.merge.outputs.merged == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Deskflow (macOS tray fix) – ${{ steps.tag.outputs.tag }}"
          body: |
            Automated build with macOS tray icon crash fix.

            **Includes:**
            - Native NSStatusItem + NSPopover to workaround Qt 6.11.1 crash on macOS 27 beta
            - Synced with latest upstream/master

            Built on ${{ github.ref_name }} at commit ${{ github.sha }}.
          files: /tmp/Deskflow-macos-arm64.dmg
          draft: false
          prerelease: true
