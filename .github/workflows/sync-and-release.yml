name: Sync Upstream & Release

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync-and-build:
    name: Sync upstream, build, release
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/macos-tray-icon-crash
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/deskflow/deskflow.git
          git fetch upstream master

      - name: Merge upstream
        id: merge
        run: |
          UPSTREAM=$(git rev-parse upstream/master)
          BASE=$(git merge-base HEAD upstream/master)
          echo "upstream_sha=${UPSTREAM:0:9}" >> $GITHUB_OUTPUT

          # On schedule: skip if already up-to-date
          # On manual dispatch: always build (even without new upstream changes)
          if [ "$UPSTREAM" = "$BASE" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "merged=false" >> $GITHUB_OUTPUT
            echo "skipped=true" >> $GITHUB_OUTPUT
            echo "::notice::Already up-to-date, skipping."
            exit 0
          fi

          # Already merged? Pretend it succeeded
          if [ "$UPSTREAM" = "$BASE" ]; then
            echo "merged=true" >> $GITHUB_OUTPUT
            echo "skipped=false" >> $GITHUB_OUTPUT
            echo "::notice::Manual dispatch — building current state."
            exit 0
          fi

          if git merge upstream/master --no-edit -m "auto: merge upstream/master"; then
            echo "merged=true" >> $GITHUB_OUTPUT
            echo "skipped=false" >> $GITHUB_OUTPUT
            echo "::notice::Merged upstream/master (${{ steps.merge.outputs.upstream_sha }})"
          else
            echo "merged=false" >> $GITHUB_OUTPUT
            echo "skipped=false" >> $GITHUB_OUTPUT
            echo "conflict_files=$(git diff --name-only --diff-filter=U | tr '\n' ' ')" >> $GITHUB_OUTPUT
            git merge --abort
          fi

      # ── Already up-to-date ──
      - name: Skip (already up-to-date)
        if: steps.merge.outputs.skipped == 'true'
        run: echo "Nothing to do."

      # ── Conflict ──
      - name: Create conflict issue
        if: steps.merge.outputs.merged == 'false' && steps.merge.outputs.skipped == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '⚠️ Merge conflict with upstream/master',
              body: `Auto-sync failed — merge conflicts with upstream/master.\n\n**Conflicting files:**\n${
                '${{ steps.merge.outputs.conflict_files }}'.split(' ').filter(f => f).map(f => '- `' + f + '`').join('\n')
              }\n\n**Resolve locally:**\n\`\`\`bash\ngit checkout fix/macos-tray-icon-crash\ngit fetch upstream master\ngit merge upstream/master\n# fix conflicts, then:\ngit push origin fix/macos-tray-icon-crash\n\`\`\``,
              labels: ['merge-conflict', 'auto-sync']
            });

      - name: Send email
        if: steps.merge.outputs.merged == 'false' && steps.merge.outputs.skipped == 'false'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "⚠️ Deskflow sync: merge conflict"
          to: ${{ secrets.MAIL_USERNAME }}
          from: Deskflow CI
          body: |
            Merge conflict with upstream/master.
            Files: ${{ steps.merge.outputs.conflict_files }}
            Resolve: https://github.com/RainkQ/deskflow/actions

      - name: Fail on conflict
        if: steps.merge.outputs.merged == 'false' && steps.merge.outputs.skipped == 'false'
        run: |
          echo "::error::Merge conflict. Workflow stopped."
          exit 1

      # ── Build & Release ──
      - name: Push merge result
        if: steps.merge.outputs.merged == 'true'
        run: git push origin fix/macos-tray-icon-crash

      - name: Install Qt
        if: steps.merge.outputs.merged == 'true'
        run: brew install qt@6

      - name: Configure CMake
        if: steps.merge.outputs.merged == 'true'
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt@6)" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_OSX_BUNDLE=ON \
            -DBUILD_TESTS=OFF

      - name: Build
        if: steps.merge.outputs.merged == 'true'
        run: cmake --build build --target Deskflow deskflow-core app_translations

      - name: Install (macdeployqt)
        if: steps.merge.outputs.merged == 'true'
        run: cmake --install build --prefix /tmp/deskflow-pkg

      - name: Package DMG
        if: steps.merge.outputs.merged == 'true'
        run: |
          hdiutil create -volname Deskflow \
            -srcfolder /tmp/deskflow-pkg/Deskflow.app \
            -ov -format UDZO /tmp/Deskflow.dmg

      - name: Generate release tag
        if: steps.merge.outputs.merged == 'true'
        id: tag
        run: |
          TAG="v$(date +%Y%m%d-%H%M%S)-${{ steps.merge.outputs.upstream_sha }}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Release
        if: steps.merge.outputs.merged == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Deskflow macOS – ${{ steps.tag.outputs.tag }}"
          body: |
            **Upstream:** deskflow/deskflow@${{ steps.merge.outputs.upstream_sha }}
            **Branch:** `fix/macos-tray-icon-crash`

            Includes macOS tray icon crash fix (native NSStatusItem + NSPopover).
          files: /tmp/Deskflow.dmg
          prerelease: true
